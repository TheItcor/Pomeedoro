plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.jlink' version '4.1.1'
}

group = 'itcor'
version = '1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainModule = 'itcor.pomeedoro'
    mainClass = 'itcor.pomeedoro.Main'
}

javafx {
    version = '21.0.6'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.media']
}

jlink {
    options = ['--strip-debug', '--compress', 'zip-6', '--no-header-files', '--no-man-pages']
    
    launcher {
        name = 'pomeedoro'
    }
    
    jpackage {
        imageName = 'Pomeedoro'
        appVersion = '1.0'
        vendor = 'Itcor'
        
        installerType = System.getProperty('os.name').toLowerCase().with { os ->
            if (os.contains('windows')) 'exe'
            else if (os.contains('mac')) 'dmg'
            else 'deb'
        }
    }
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
