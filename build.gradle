plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.jlink' version '4.1.1'
}

group = 'itcor'
version = '1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainModule = 'itcor.pomeedoro'
    mainClass = 'itcor.pomeedoro.Main'
    applicationDefaultJvmArgs = [
            '-Xms8m',
            '-Xmx48m',
            '-Xss256k',
            '-XX:+UseSerialGC',
            '-XX:TieredStopAtLevel=1',
            '-XX:MaxMetaspaceSize=48m',
            '-XX:CompressedClassSpaceSize=16m',
            '-XX:ReservedCodeCacheSize=24m',
            '-XX:MaxDirectMemorySize=32m',
            '-XX:-UsePerfData',
            '-Dprism.maxvram=16M',
            '-Dprism.order=sw',
            '-Dglass.gtk.uiScale=1'
    ]
}

javafx {
    version = '21.0.6'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.media']
}

jlink {
    options = ['--strip-debug', '--compress', 'zip-6', '--no-header-files', '--no-man-pages']

    launcher {
        name = 'pomeedoro'
        jvmArgs = [
                // Heap and GC
                '-Xms8m',
                '-Xmx48m',
                '-Xss256k',
                '-XX:+UseSerialGC',
                '-XX:TieredStopAtLevel=1',

                // Native memory limits
                '-XX:MaxMetaspaceSize=48m',
                '-XX:CompressedClassSpaceSize=16m',
                '-XX:ReservedCodeCacheSize=24m',
                '-XX:MaxDirectMemorySize=32m',

                // Reduce JVM/JIT/GC thread count
                '-XX:CICompilerCount=1',
                '-XX:ActiveProcessorCount=2',
                '-XX:ParallelGCThreads=1',
                '-XX:ConcGCThreads=1',

                // Disable extra JVM diagnostics
                '-XX:-UsePerfData',

                // JavaFX rendering
                '-Dprism.maxvram=16M',
                '-Dprism.order=sw',
                '-Dglass.gtk.uiScale=1'
        ]
    }

    jpackage {
        imageName = 'Pomeedoro'
        appVersion = '1.0'
        vendor = 'Itcor'

        imageOutputDir = file("$buildDir/temp-image")
        installerOutputDir = file("$buildDir/temp-installers")

        def os = org.gradle.internal.os.OperatingSystem.current()
        def requestedType = project.findProperty('installerType')?.toString()

        installerType = requestedType ?: (
                os.isLinux() ? 'deb' :
                        os.isWindows() ? 'exe' :
                                os.isMacOsX() ? 'dmg' :
                                        'rpm'
        )

        def opts = ['--name', 'pomeedoro']

        if (os.isLinux()) {
            opts.addAll([
                    '--linux-package-name', 'pomeedoro',
                    '--linux-shortcut'
            ])
        } else if (os.isWindows()) {
            opts.addAll([
                    '--win-menu',
                    '--win-shortcut',
                    '--win-dir-chooser',
                    '--win-menu-group', 'Pomeedoro'
            ])
        } else if (os.isMacOsX()) {
            opts.addAll([
                    '--mac-package-identifier', 'itcor.pomeedoro',
                    '--mac-package-name', 'Pomeedoro'
            ])
        }

        installerOptions = opts
    }
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('jpackageTar', Tar) {
    dependsOn 'jpackageImage'
    group = 'distribution'
    archiveBaseName.set('pomeedoro')
    archiveVersion.set(project.version.toString())
    archiveExtension.set('tar.gz')
    compression = Compression.GZIP
    destinationDirectory.set(layout.buildDirectory.dir('temp-distributions'))

    from(layout.buildDirectory.dir('temp-image/Pomeedoro')) {
        into 'Pomeedoro'
    }
}

tasks.register('buildDeb') {
    dependsOn 'jpackage'
    group = 'distribution'
    doLast {
        copy {
            from file("$buildDir/temp-installers")
            into buildDir
            include '*.deb'
        }
    }
}

tasks.register('buildRpm') {
    dependsOn 'jpackage'
    group = 'distribution'
    doLast {
        copy {
            from file("$buildDir/temp-installers")
            into buildDir
            include '*.rpm'
        }
    }
}

tasks.register('buildTar') {
    dependsOn 'jpackageTar'
    group = 'distribution'
    doLast {
        copy {
            from file("$buildDir/temp-distributions")
            into buildDir
            include '*.tar.gz'
        }
    }
}