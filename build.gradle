plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.jlink' version '4.1.1'
}

group = 'itcor'
version = '1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainModule = 'itcor.pomeedoro'
    mainClass = 'itcor.pomeedoro.Main'
    applicationDefaultJvmArgs = [
            '-Xms8m',
            '-Xmx48m',
            '-Xss256k',
            '-XX:+UseSerialGC',
            '-XX:TieredStopAtLevel=1',
            '-XX:MaxMetaspaceSize=48m',
            '-XX:CompressedClassSpaceSize=16m',
            '-XX:ReservedCodeCacheSize=24m',
            '-XX:MaxDirectMemorySize=32m',
            '-XX:-UsePerfData',
            '-Dprism.maxvram=16M',
            '-Dprism.order=sw',
            '-Dglass.gtk.uiScale=1'
    ]
}

javafx {
    version = '21.0.6'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.media']
}

jlink {
    options = ['--strip-debug', '--compress', 'zip-6', '--no-header-files', '--no-man-pages']

    launcher {
        name = 'pomeedoro'
        jvmArgs = [
                '-Xms8m',
                '-Xmx64m',
                '-Xss256k',
                '-XX:+UseSerialGC',
                '-XX:MaxRAM=64m',
                '-XX:TieredStopAtLevel=1',
                '-Dprism.maxvram=16M',
                '-Djava.awt.headless=true'
        ]
    }

    jpackage {
        imageName = 'Pomeedoro'
        appVersion = '1.0'
        vendor = 'Itcor'
        installerType = project.findProperty('installerType') ?: 'deb'
        installerOptions = ['--name', 'pomeedoro', '--linux-package-name', 'pomeedoro', '--linux-shortcut']
    }
}



repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
